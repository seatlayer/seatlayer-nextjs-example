<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seat picker with a script tag</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #picker {
        width: 100%;
        height: 640px;
      }
    </style>
  </head>
  <body>
    <div id="picker"></div>
    <p id="status"></p>

    <!-- The buyer SDK as one script. It adds a global called seatlayer. -->
    <script src="https://cdn.seatlayer.io/seatlayer-js@0/seatlayer-buyer.js"></script>
    <script>
      const status = document.getElementById("status");

      const picker = new seatlayer.SeatPicker({
        container: "#picker",
        event: "<YOUR_EVENT_KEY>",
        publicKey: "<YOUR_PUBLIC_KEY>",
        // The buyer pressed checkout. Send only the hold id to your server,
        // which reads the real prices back from SeatLayer before charging.
        onCheckout: async (_hold, _seats, handoff) => {
          status.textContent = "Hold id: " + handoff.holdId;
          const response = await fetch("/api/hold", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ holdId: handoff.holdId }),
          });
          const result = await response.json();
          console.log("Continue to checkout with hold id:", handoff.holdId, result);
        },
      });

      picker.render();
    </script>
  </body>
</html>
